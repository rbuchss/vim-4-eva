name: Lua Lint
on:
  pull_request:
    branches: [main]

jobs:
  lint_lua_job:
    runs-on: ubuntu-latest
    name: Run Lua Lint Check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Run Selene
        uses: ./.github/actions/run-make
        with:
          target: lint-lua
          with_coverage: false
