name: Vim Test
on:
  pull_request:
    branches: [main]

jobs:
  test_vim_job:
    runs-on: ubuntu-latest
    name: Run Vim Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Run Vim Tests
        uses: ./.github/actions/run-make
        with:
          target: test-vim
          with_coverage: false
